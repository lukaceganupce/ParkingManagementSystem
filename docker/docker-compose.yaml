name: parkoid

services:
  # Frontend web server: index.html and static assets (Web Components, CSS, JS, i18n)
  frontend-server:
    image: nginx:alpine
    container_name: parkoid-frontend-server
    ports:
      - "8080:80"
    volumes:
      - ../src/fe/src:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    restart: unless-stopped

  # Backend web server: reverse proxy to the Node.js app
  backend-server:
    image: nginx:alpine
    container_name: parkoid-backend-server
    ports:
      - "8081:80"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Node.js + Express application (REST API, business logic)
  app:
    build:
      context: ../src/be/src
    container_name: parkoid-app
    volumes:
      - ../src/be/src:/usr/src/app                # sources live outside the container (nodemon reloads on change)
      - node_modules:/usr/src/app/node_modules    # dependencies kept in a volume, installed on start
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-parkoid}
      DB_USER: ${APP_DB_USER:-parkoid_user_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-parkoid_user_pwd}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # PostgreSQL database server
  db:
    image: postgres:16-alpine
    container_name: parkoid-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkoid}
      POSTGRES_USER: ${POSTGRES_USER:-parkoid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkoid}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pgdata:
  node_modules:



